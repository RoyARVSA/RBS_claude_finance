name: RBS Signal Scanner

on:
  schedule:
    - cron: '*/15 * * * *'   # 每 15 分鐘
  workflow_dispatch:
    inputs:
      watchlist:
        description: '臨時覆蓋 watchlist（逗號分隔），留空使用 watchlist_state.json'
        required: false
        default: ''

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # 允許 workflow 把 watchlist_state.json commit 回 repo

# 防自我重疊（審查團 F1，紅隊+維運獨立匯合）：一輪拖過 15 分時下一輪不得並跑——
# 並跑會雙 getUpdates（指令雙派工、autotrade 雙下單）+ 雙 commit state 必衝突
concurrency:
  group: signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # /plantest opt（參數尋優）最長 ~4 分 + 掃描；留裕度防超時

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scanner-v2
          restore-keys: |
            ${{ runner.os }}-pip-scanner-

      - name: Install dependencies
        # 釘版（審查團 F14）：此環境載有全部 Secrets，未釘版等於每 15 分鐘
        # 對供應鏈投毒開門。版本取自 2026-08 production 實跑紀錄。
        run: pip install yfinance==1.5.2 pandas==3.0.5 numpy==2.4.6 requests==2.34.2

      - name: Run signal scanner
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 手動觸發時可臨時覆蓋 watchlist（不會存入 state）
          WATCHLIST: ${{ github.event.inputs.watchlist }}
          # 每日 AI 晨報用（未設則晨報走純數據版，不會壞）
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
          # 每日晨報用的 FRED 總經（可選）
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 基本面備援（yfinance .info 被限流時的後援，可選）
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # SEC 內部人交易（Form 4）自訂 User-Agent（可選，有預設值）
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Alpaca 模擬交易（可選；未設則自動交易不執行）
          ALPACA_KEY_ID:     ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python scan_signals.py

      - name: Commit updated state + trade journal
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          # 分開 add：git add 對多個 pathspec 是原子的，任一檔不存在會整批中止
          git add watchlist_state.json 2>/dev/null || true
          git add trade_journal.json 2>/dev/null || true
          git diff --staged --quiet && echo "No state changes." || \
            git commit -m "chore: update bot state + trade journal [skip ci]"

      - name: Push state changes
        run: |
          # 衝突安全推送（審查團 F2）：舊 rebase-retry 撞 state 檔內容衝突會卡半途、
          # || true 吞錯、其後 push 必敗——狀態遺失且可能把衝突標記寫進 state（連鎖
          # 觸發 last_update_id 歸零重播）。改為「本輪結果為準」：push 失敗就同步遠端
          # 最新，重放本輪 state 檔再 commit。state 是本輪剛產生的最新真相，覆蓋合理。
          cp watchlist_state.json /tmp/ws.json 2>/dev/null || true
          cp trade_journal.json  /tmp/tj.json 2>/dev/null || true
          for i in 1 2 3; do
            git push origin HEAD && exit 0
            echo "push 失敗，同步遠端後重放 state ($i)…"
            git rebase --abort 2>/dev/null || true
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard "origin/${GITHUB_REF_NAME}"
            cp /tmp/ws.json watchlist_state.json 2>/dev/null || true
            cp /tmp/tj.json trade_journal.json  2>/dev/null || true
            git add watchlist_state.json trade_journal.json 2>/dev/null || true
            git diff --staged --quiet || \
              git commit -m "chore: update bot state + trade journal [skip ci]"
          done
          git push origin HEAD || echo "::warning::push 最終失敗（狀態未持久化，下次可能重發）"
