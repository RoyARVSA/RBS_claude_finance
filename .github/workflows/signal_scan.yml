name: RBS Signal Scanner

on:
  schedule:
    # 每小時觸發一次；每次觸發在 actions_loop.py 內長駐最多 ~5.5 小時（每 15 分鐘一輪完整掃描、
    # 每分鐘回應 Telegram 指令）。原本 */15 被 GitHub 大量丟棄（一天只跑 3–8 次，#60）。
    # 避開整點（:00 是全站尖峰，最容易被丟）
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      watchlist:
        description: '臨時覆蓋 watchlist（逗號分隔），留空使用 watchlist_state.json'
        required: false
        default: ''
      loop_minutes:
        description: '本輪長駐分鐘數（預設 330；填 1 = 只跑一輪就結束）'
        required: false
        default: '330'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write   # 允許 workflow 把 watchlist_state.json commit 回 repo

# 防自我重疊（審查團 F1，紅隊+維運獨立匯合）：一輪拖過 15 分時下一輪不得並跑——
# 並跑會雙 getUpdates（指令雙派工、autotrade 雙下單）+ 雙 commit state 必衝突
concurrency:
  group: signal-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 長駐迴圈預算 330 分 + 收尾；GitHub 上限 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Sync to the latest branch head
        # 排隊接手的工作 checkout 的是觸發當下的舊 SHA（前一個工作已推了好幾小時的 state）→ 先同步到最新（#60）
        run: git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard FETCH_HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-scanner-v2
          restore-keys: |
            ${{ runner.os }}-pip-scanner-

      - name: Install dependencies
        # 釘版（審查團 F14）：此環境載有全部 Secrets，未釘版等於每 15 分鐘
        # 對供應鏈投毒開門。版本取自 2026-08 production 實跑紀錄。
        run: pip install yfinance==1.5.2 pandas==3.0.5 numpy==2.4.6 requests==2.34.2 scipy==1.17.1

      - name: Run signal scanner
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # 手動觸發時可臨時覆蓋 watchlist（不會存入 state）
          WATCHLIST: ${{ github.event.inputs.watchlist }}
          # 每日 AI 晨報用（未設則晨報走純數據版，不會壞）
          LLM_API_KEY:  ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL:    ${{ secrets.LLM_MODEL }}
          # 每日晨報用的 FRED 總經（可選）
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          # 基本面備援（yfinance .info 被限流時的後援，可選）
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # SEC 內部人交易（Form 4）自訂 User-Agent（可選，有預設值）
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Alpaca 模擬交易（可選；未設則自動交易不執行）
          ALPACA_KEY_ID:     ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          # 敏感區塊加密（可選；設了之後論點/淨值/引擎簿記/策略參數以密文 commit）
          STATE_ENC_KEY: ${{ secrets.STATE_ENC_KEY }}
          # Alpha Vantage 免費 key（可選；財報驚奇 SUE 歷史回填，25 次/日由程式計數）
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
          # 長駐迴圈參數（#60）：預算／完整輪間隔／指令輪詢
          LOOP_MINUTES: ${{ github.event.inputs.loop_minutes || '330' }}
          ROUND_SEC: '900'
          PYTHONUNBUFFERED: '1'     # 長駐 5.5 小時：日誌即時出現、execv 重啟／逾時被殺時不丟輸出
          POLL_SEC: '60'
        run: python actions_loop.py

      - name: Persist state (safety net; the loop already persists every round)
        if: always()
        run: bash scripts/persist_state.sh
